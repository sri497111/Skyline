<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f1f5f9;
            overflow: hidden;
        }
        /* Completely strips away map controls for a pure plain layout look */
        .leaflet-control-zoom, .leaflet-control-attribution {
            display: none !important;
        }

        /* Google Maps-style Location Marker Styling */
        .custom-location-icon {
            background: none !important;
            border: none !important;
        }
        .location-marker {
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .location-marker-inner {
            width: 10px;
            height: 10px;
            background-color: #0076ff;
            border-radius: 50%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // Active OpenWeatherMap API Key extracted from your map-light.html
        const OWM_API_KEY = "7dd61afc5903f81a45839eb528dcbabd"; 

        const initialLat = 51.477;
        const initialLon = 0;

        // 1. Initialize Leaflet map with zero interface elements or operational overhead at Zoom 11
        const map = L.map('map', {
            zoomControl: false,
            dragging: false,
            touchZoom: false,
            doubleClickZoom: false,
            scrollWheelZoom: false,
            boxZoom: false,
            keyboard: false,
            zoomAnimation: false,
            fadeAnimation: false,
            markerZoomAnimation: false
        }).setView([initialLat, initialLon], 11); 

        // 2. Add CARTO's clean 'Positron' light grey layout tiles as the base layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 20
        }).addTo(map);

        // 3. Overlay the OpenWeatherMap Precipitation Layer natively on top
        L.tileLayer(`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${OWM_API_KEY}`, {
            maxZoom: 19,
            opacity: 0.75
        }).addTo(map);

        // Create the Google Maps-style custom HTML icon
        const locationIcon = L.divIcon({
            className: 'custom-location-icon',
            html: '<div class="location-marker"><div class="location-marker-inner"></div></div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        // Add the persistent location pointer to the initial coordinates immediately
        let locationMarker = L.marker([initialLat, initialLon], { icon: locationIcon }).addTo(map);

        /**
         * Call from Python: self.web.page().runJavaScript("updatePreview(29.4241, -98.4936)")
         */
        function updatePreview(lat, lon) {
            const cleanLat = parseFloat(lat);
            const cleanLon = parseFloat(lon);
            
            // Re-centers the view instantly with zero drag/slide processing overhead at Zoom 11
            map.setView([cleanLat, cleanLon], 11, { animate: false });

            // Move the location marker alongside the view adjustment
            if (locationMarker) {
                locationMarker.setLatLng([cleanLat, cleanLon]);
            }
        }
    </script>
</body>
</html>
