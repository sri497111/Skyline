<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a; /* Sleek dark background slate */
            overflow: hidden;
        }
        /* Completely strips away map controls for a pure plain layout look */
        .leaflet-control-zoom, .leaflet-control-attribution {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // Active OpenWeatherMap API Key extracted from your map-light.html
        const OWM_API_KEY = "7dd61afc5903f81a45839eb528dcbabd"; 

        // 1. Initialize Leaflet map with zero interface elements or operational overhead at Zoom 11
        const map = L.map('map', {
            zoomControl: false,
            dragging: false,
            touchZoom: false,
            doubleClickZoom: false,
            scrollWheelZoom: false,
            boxZoom: false,
            keyboard: false,
            zoomAnimation: false,
            fadeAnimation: false,
            markerZoomAnimation: false
        }).setView([29.4241, -98.4936], 11); 

        // 2. Add CARTO's clean 'Dark Matter' layout tiles as the base layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 20
        }).addTo(map);

        // 3. Overlay the OpenWeatherMap Precipitation Layer natively on top
        L.tileLayer(`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${OWM_API_KEY}`, {
            maxZoom: 19,
            opacity: 0.70 // Balanced opacity to let high-contrast dark streets peek through the rain data
        }).addTo(map);

        /**
         * Call from Python: self.web.page().runJavaScript("updatePreview(29.4241, -98.4936)")
         */
        function updatePreview(lat, lon) {
            const cleanLat = parseFloat(lat);
            const cleanLon = parseFloat(lon);
            
            // Re-centers the view instantly with zero drag/slide processing overhead at Zoom 11
            map.setView([cleanLat, cleanLon], 11, { animate: false });
        }
    </script>
</body>
</html>
